<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(a) 국소 섬광 상자</title>
<!--
  Case (a): a 190 x 120 CSS px box flashes white/black at 5 Hz (100 ms per state)
  from page load. On a Galaxy S24 at 300 mm it covers ~8 % of the viewport and
  ~0.0085 sr, above the WCAG 2.3.1 area threshold (0.006 sr). The mean luminance
  of the whole viewport changes by only ~0.08, which the old whole-viewport
  screening did not count as a transition.
-->
<style>
  html, body { margin: 0; background: #ffffff; color: #202124; font-family: sans-serif; }
  p { font-size: 16px; line-height: 24px; margin: 16px; }
  #box { position: absolute; left: 85px; top: 330px; width: 190px; height: 120px; background: #ffffff; outline: 1px solid #dadce0; }
</style>
</head>
<body>
<p>상자 하나가 초당 5회 흰색과 검은색으로 깜빡입니다.</p>
<div id="box"></div>
<script>
  (function () {
    var box = document.getElementById('box');
    var n = 0;
    setInterval(function () {
      n += 1;
      box.style.background = n % 2 ? '#000000' : '#ffffff';
    }, 100);
  })();
</script>
</body>
</html>
